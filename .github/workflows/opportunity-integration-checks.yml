name: Opportunity integration checks
on:
  push:
    branches: [integration/fasulye-supabase, feature/opportunity-engine-v2, feature/panel-session-ux]
  pull_request:
    paths:
      - 'engine/tools/opportunity_engine/**'
      - 'netlify/**'
      - 'web/**'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - run: python -m unittest discover -s engine/tools/opportunity_engine/tests -v
      - run: npm ci
      - run: npm test
      - run: npm run build
